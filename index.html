<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>С Днём Рождения! 🎉</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff6b6b, #ff9f43, #feca57);
            font-family: 'Comic Sans MS', cursive;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 4em;
            color: #fff;
            text-shadow: 3px 3px 0 #ff4757;
            animation: bounce 2s infinite;
        }

        .message {
            font-size: 1.5em;
            color: #2f3542;
            margin: 20px;
            line-height: 1.5;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            animation: confetti 4s linear infinite;
            top: -50px;
        }

        @keyframes confetti {
            0% { 
                transform: translateY(0) translateX(var(--x)) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% { 
                transform: translateY(110vh) translateX(calc(var(--x) * 2)) rotate(720deg) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">        
        <h1>🥳С Днём Рождения! 🎂🎈</h1>
        
        <div class="message">
            <p>Дорогой Андрей!</p>
            <p>Желаю вам счастья,</p>
            <p>здоровья и успехов в работе!</p>
        </div>
    </div>

    <script>
        function createConfetti() {
            const colors = ['#ff9f43', '#f368e0', '#48dbfb', '#54a0ff', '#2ed573'];
            
            for (let i = 0; i < 15; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = `${Math.random() * 100}%`;
                confetti.style.setProperty('--x', `${Math.random() * 100 - 50}vw`);
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = `${Math.random() * 2}s`;
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 4000);
            }
        }

        setInterval(createConfetti, 300);
        createConfetti();
    </script>
</body>
</html>
